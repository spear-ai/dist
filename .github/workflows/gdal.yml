name: "gdal: build and release"

# Tags are package-scoped because this repo publishes several distributions.
# `gdal-v3.13.2` releases GDAL 3.13.2; consumers strip the prefix with mise's
# `version_prefix`. A pull request touching the package builds and smoke-tests
# all three platforms without publishing, so a version bump is proven before
# it is ever tagged.
on:
  push:
    tags: ["gdal-v*"]
  pull_request:
    paths:
      - "packages/gdal/**"
      - ".github/workflows/gdal.yml"
  workflow_dispatch:
    inputs:
      gdal_version:
        description: "Override GDAL version (defaults to versions.env)"
        required: false
        type: string

# Least privilege: only the release job writes anything. Build jobs, including
# the ones that run on pull requests, get read-only access.
permissions:
  contents: read

concurrency:
  group: gdal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    defaults:
      run:
        # Actions selects `sh` inside a container and bash on host runners.
        # Naming bash keeps every step identical across the matrix.
        shell: bash
        working-directory: packages/gdal
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            container: ""
          - platform: linux-x64
            runner: ubuntu-24.04
            # manylinux_2_28 pins the glibc floor at 2.28, so the tarball runs
            # on Ubuntu 20.04+, Debian 10+ and RHEL 8+. Building on a bare
            # ubuntu-24.04 runner would require glibc 2.39 on every consumer.
            container: quay.io/pypa/manylinux_2_28_x86_64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64

    steps:
      # fetch-depth 1 still fetches the commit object, which is all %ct needs.
      - uses: actions/checkout@v7

      # checkout records its safe.directory entry under a temporary HOME that
      # later steps do not see, so git in a container refuses the workspace as
      # dubiously owned -- the runner owns it, the container runs as root.
      # dist-version.sh needs git to read the commit, so declare it here.
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The manylinux image already ships cmake, bzip2, gcc 14 and binutils;
      # only ninja is missing.
      - name: Install ninja (Linux)
        if: runner.os == 'Linux'
        run: |
          /opt/python/cp312-cp312/bin/pip install --no-cache-dir ninja
          echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"

      # The manylinux image already ships cmake, bzip2, gcc 14, binutils and
      # uv, so only macOS needs these. uv matters because the smoke test builds
      # the PyPI bindings the way the consuming project does; its
      # `python -m venv` fallback can land on an interpreter that drops
      # LDFLAGS, failing the rpath assertion for reasons unrelated to the build.
      - name: Install ninja and uv (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja uv

      - name: Override GDAL version
        if: inputs.gdal_version != ''
        run: |
          set -euo pipefail
          v="${{ inputs.gdal_version }}"
          url="https://github.com/OSGeo/gdal/releases/download/v${v}/gdal-${v}.tar.gz"
          sha="$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)"
          sed -i.bak -e "s/^GDAL_VERSION=.*/GDAL_VERSION=${v}/" \
                     -e "s/^GDAL_SHA256=.*/GDAL_SHA256=${sha}/" versions.env
          rm -f versions.env.bak
          echo "Building GDAL ${v} (sha256 ${sha})"

      - name: Verify the tag matches versions.env
        if: startsWith(github.ref, 'refs/tags/gdal-v')
        run: |
          set -euo pipefail
          tagged="${GITHUB_REF_NAME#gdal-v}"
          expected="$(./dist-version.sh)"
          if [ "$tagged" != "$expected" ]; then
            echo "tag $GITHUB_REF_NAME does not match this commit" >&2
            echo "  tag says:  $tagged" >&2
            echo "  commit is: $expected" >&2
            echo "Tag the commit you mean to release: git tag gdal-v\$(packages/gdal/dist-version.sh)" >&2
            exit 1
          fi

      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: packages/gdal/work/cache
          key: gdal-src-${{ hashFiles('packages/gdal/versions.env') }}

      - name: Build
        run: ./build.sh

      - name: Smoke test
        run: ./smoke-test.sh work/out --python

      - uses: actions/upload-artifact@v7
        with:
          name: gdal-${{ matrix.platform }}
          path: packages/gdal/work/dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/gdal-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # create the release
      id-token: write        # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          ls -lh

      # Lets `mise` verify the tarball came from this workflow, not a
      # look-alike upload. mise checks GitHub attestations by default.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      - uses: softprops/action-gh-release@v3
        with:
          name: "GDAL ${{ github.ref_name }}"
          files: dist/*
          generate_release_notes: true
